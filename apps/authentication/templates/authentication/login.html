<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AREA Attendance System | Log In</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom styling for Django's form.as_p output -->
    <style type="text/tailwindcss">
        @layer components {
            form p {
                @apply mb-4 flex flex-col text-left;
            }
            form label {
                @apply block text-sm font-medium text-slate-700 mb-1 tracking-wide;
            }
            form input[type="text"],
            form input[type="password"],
            form input[type="email"] {
                @apply w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-slate-900 transition-colors duration-200 bg-slate-50/50;
            }
            form ul.errorlist {
                @apply text-xs text-rose-600 mb-2 list-none p-0 font-medium;
            }
        }
    </style>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 antialiased">

    <main class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200/80 overflow-hidden">

        <!-- Header / Branding -->
        <div class="px-8 pt-8 pb-6 text-center border-b border-slate-100 bg-slate-50/50">
            <div
                class="inline-flex items-center justify-center w-14 h-14 rounded-xl bg-indigo-600 text-white font-bold text-xl shadow-md shadow-indigo-200 mb-4">
                AREA
            </div>
            <h1 class="text-xl font-bold text-slate-900 tracking-tight">
                Azerbaijan Robotics & Engineering Academy
            </h1>
            <p class="text-xs font-semibold text-indigo-600 uppercase tracking-widest mt-1">
                Attendance Management System
            </p>
        </div>

        <!-- Form Container -->
        <div class="p-8">
            <form method="post" class="space-y-4">
                {% csrf_token %}

                <!-- Renders Django Form with Tailwind styles applied -->
                {{ form.as_p }}

                <button type="submit"
                    class="w-full mt-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 px-4 rounded-lg shadow-md shadow-indigo-100 transition-all duration-200 hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                    Log In
                </button>
            </form>
        </div>

        <!-- Footer -->
        <div class="px-8 py-4 bg-slate-50 border-t border-slate-100 text-center">
            <p class="text-xs text-slate-500">
                Authorized Personnel Only &bull; &copy; AREA Attendance System
            </p>
        </div>

    </main>

</body>

</html>
