{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register your device | AREA Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 flex items-center justify-center p-6">
    <main class="w-full max-w-md rounded-xl bg-white p-8 shadow-sm">
        <h1 class="text-2xl font-semibold">Register your device</h1>
        <p class="mt-3 text-sm text-slate-600">
            Enter the one-time setup code given to you directly by a super administrator.
            The code expires after 30 minutes and can register one passkey.
        </p>
        <form class="mt-6 space-y-4" id="passkey-enrollment-form"
            data-options-url="{% url 'passkey_enrollment_options' %}"
            data-complete-url="{% url 'passkey_enrollment_complete' %}">
            {% csrf_token %}
            <label class="block text-sm font-medium" for="username">Username</label>
            <input class="w-full rounded-md border border-slate-300 px-3 py-2" id="username"
                name="username" autocomplete="username" required>
            <label class="block text-sm font-medium" for="setup-code">One-time setup code</label>
            <input class="w-full rounded-md border border-slate-300 px-3 py-2" id="setup-code"
                name="setup_code" autocomplete="one-time-code" required>
            <label class="block text-sm font-medium" for="device-name">Device name</label>
            <input class="w-full rounded-md border border-slate-300 px-3 py-2" id="device-name"
                name="device_name" maxlength="80" value="Personal phone" required>
            <button class="w-full rounded-md bg-slate-900 px-4 py-3 font-medium text-white disabled:opacity-60"
                id="prepare-passkey" type="submit">
                Continue
            </button>
        </form>
        <button class="mt-4 hidden w-full rounded-md bg-blue-700 px-4 py-3 font-medium text-white disabled:opacity-60"
            id="create-passkey" type="button">
            Create passkey on this device
        </button>
        <p class="mt-4 min-h-6 text-sm text-slate-700" id="passkey-status" role="status" aria-live="polite"></p>
        <p class="mt-6 text-sm">
            <a class="text-blue-700 hover:underline" href="{% url 'login' %}">Return to login</a>
        </p>
    </main>
    <script src="{% static 'authentication/passkey.js' %}" defer></script>
</body>
</html>
