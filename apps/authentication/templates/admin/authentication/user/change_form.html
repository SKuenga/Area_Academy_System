{% extends "admin/change_form.html" %}

{% block submit_buttons_bottom %}
    {{ block.super }}
    {% if show_passkey_setup_button %}
        <div class="submit-row">
            <input
                type="submit"
                name="_issue_passkey_setup_code"
                value="Issue one-time passkey setup code"
                onclick="return confirm('Verify this employee in person before issuing a setup code. The code will be shown once. Continue?');"
            >
        </div>
    {% endif %}
{% endblock %}
